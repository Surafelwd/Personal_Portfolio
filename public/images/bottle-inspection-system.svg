<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="540" rx="18" fill="#f8fafc"/>
  <rect x="1" y="1" width="998" height="538" rx="17" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="500" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Automated Bottle Inspection &amp; Sorting System</text>
  <text x="500" y="72" text-anchor="middle" font-size="14" fill="#64748b">STM32-based fill-level quality control</text>

  <!-- Sensor -->
  <rect x="40" y="215" width="160" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="120" y="252" text-anchor="middle" font-size="17" font-weight="600" fill="#0c4a6e">Analog Sensor</text>
  <text x="120" y="276" text-anchor="middle" font-size="13" fill="#0369a1">ADC1 · Channel 0</text>

  <!-- STM32 -->
  <rect x="290" y="150" width="230" height="220" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="405" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">STM32 MCU</text>
  <line x1="315" y1="198" x2="495" y2="198" stroke="#c4b5fd"/>
  <text x="405" y="226" text-anchor="middle" font-size="13" fill="#5b21b6">1. Read ADC value</text>
  <text x="405" y="252" text-anchor="middle" font-size="13" fill="#5b21b6">2. Threshold check</text>
  <text x="405" y="274" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">870 ≤ ADC ≤ 1524 ?</text>
  <text x="405" y="300" text-anchor="middle" font-size="13" fill="#5b21b6">3. Set servo PWM</text>
  <text x="405" y="326" text-anchor="middle" font-size="13" fill="#5b21b6">4. Update LCD &amp; UART</text>

  <!-- Servo -->
  <rect x="610" y="95" width="190" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="705" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#78350f">Servo Motor</text>
  <text x="705" y="153" text-anchor="middle" font-size="13" fill="#b45309">PWM · TIM3 CH1</text>

  <!-- Bins -->
  <rect x="845" y="88" width="125" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="907" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Accepted</text>
  <text x="907" y="121" text-anchor="middle" font-size="11" fill="#15803d">pulse 1500</text>
  <rect x="845" y="142" width="125" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="907" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Rejected</text>
  <text x="907" y="175" text-anchor="middle" font-size="11" fill="#b91c1c">pulse 2000</text>

  <!-- LCD -->
  <rect x="610" y="220" width="190" height="80" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="705" y="255" text-anchor="middle" font-size="17" font-weight="600" fill="#134e4a">LCD Display</text>
  <text x="705" y="278" text-anchor="middle" font-size="13" fill="#0f766e">Status + running counts</text>

  <!-- UART -->
  <rect x="610" y="345" width="190" height="80" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="705" y="380" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">PC Serial Monitor</text>
  <text x="705" y="403" text-anchor="middle" font-size="13" fill="#475569">UART status messages</text>

  <!-- Button -->
  <rect x="290" y="430" width="230" height="70" rx="12" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text x="405" y="462" text-anchor="middle" font-size="17" font-weight="600" fill="#881337">Pause / Resume</text>
  <text x="405" y="484" text-anchor="middle" font-size="13" fill="#be123c">Button PA12 · debounced interrupt</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="200" y1="260" x2="288" y2="260"/>
    <line x1="520" y1="200" x2="608" y2="140"/>
    <line x1="520" y1="260" x2="608" y2="260"/>
    <line x1="520" y1="320" x2="608" y2="375"/>
    <line x1="802" y1="120" x2="843" y2="108"/>
    <line x1="802" y1="150" x2="843" y2="162"/>
    <line x1="405" y1="428" x2="405" y2="372"/>
  </g>
</svg>
